name: Build and Push OHIF to ECR

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - mib-air-release
      - mib-air-release-*

permissions:
  contents: read

jobs:
  build:
    runs-on:
      - codebuild-CCR-OSCRI-GitHub-Actions-${{ github.run_id }}-${{ github.run_attempt }}

    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 729017761751.dkr.ecr.us-east-1.amazonaws.com
      IMAGE_NAME: 729017761751.dkr.ecr.us-east-1.amazonaws.com/mib-air-ohif-viewer

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute tags
        id: meta
        shell: bash
        env:
          BRANCH_NAME:
            ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          branch="$BRANCH_NAME"

          if [[ "$branch" == "mib-air-release" ]]; then
            image_tags="latest"
          else
            # Same normalization as deploy.yml, so the branch name can be passed
            # as deploy_tag there: fix/tmtv -> fix-tmtv, IDC-123 -> idc-123.
            branch_tag="$(printf '%s' "$branch" \
              | tr '[:upper:]' '[:lower:]' \
              | sed 's#/#-#g' \
              | sed 's#[^a-z0-9_.-]#-#g')"

            if [[ ! "$branch_tag" =~ ^[a-z0-9_][a-z0-9_.-]{0,127}$ ]]; then
              echo "Branch '$branch' does not map to a valid image tag ('$branch_tag')." >&2
              exit 1
            fi

            # Environment tags are written only by mib-air-release builds and
            # deploy.yml; a branch must never overwrite them.
            case "$branch_tag" in
              latest | next | dev | test | stage)
                echo "Branch '$branch' maps to reserved image tag '$branch_tag'. Rename the branch." >&2
                exit 1
                ;;
            esac

            image_tags="$branch_tag"
            if [[ "$branch" == mib-air-release-* ]]; then
              image_tags+=$'\nnext\ndev'
            fi
          fi

          {
            echo "image_tags<<EOF"
            printf '%s\n' "$image_tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to ECR
        if: github.event_name == 'push'
        shell: bash
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build image
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.image_tags }}
        run: |
          first_tag="$(printf '%s\n' "$IMAGE_TAGS" | sed -n '1p')"
          docker build -f Dockerfile-MIB-AIR -t "$IMAGE_NAME:$first_tag" .

          while IFS= read -r tag; do
            [[ -z "$tag" || "$tag" == "$first_tag" ]] && continue
            docker tag "$IMAGE_NAME:$first_tag" "$IMAGE_NAME:$tag"
          done <<< "$IMAGE_TAGS"

      - name: Push image tags
        if: github.event_name == 'push'
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.image_tags }}
        run: |
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            docker push "$IMAGE_NAME:$tag"
          done <<< "$IMAGE_TAGS"
